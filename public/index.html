<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070f" />
    <title>Gatsby v0.5</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #07070f;
        color: #e0e0e0;
        font-family: 'Outfit', sans-serif;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0a0a15; }
      ::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #2a2a4e; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Gatsby.</noscript>
    <div id="root"></div>
  </body>
</html>
